<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Quick Edit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Theme configuration to map VS Code colors to Tailwind */
        :root {
            --vsc-bg: var(--vscode-editor-background);
            --vsc-fg: var(--vscode-editor-foreground);
            --vsc-muted: var(--vscode-descriptionForeground);
            --vsc-border: var(--vscode-panel-border);
            --vsc-widget: var(--vscode-editorWidget-background);
            --vsc-button-bg: var(--vscode-button-background);
            --vsc-button-fg: var(--vscode-button-foreground);
            --vsc-button-hover: var(--vscode-button-hoverBackground);
            --vsc-input-bg: var(--vscode-input-background);
            --vsc-input-fg: var(--vscode-input-foreground);
            --vsc-input-border: var(--vscode-input-border);
            --vsc-link: var(--vscode-textLink-foreground);
        }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--vsc-bg);
            color: var(--vsc-fg);
            font-family: var(--vscode-font-family), -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--vscode-scrollbarSlider-background); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--vscode-scrollbarSlider-hoverBackground); }
        ::-webkit-scrollbar-thumb:active { background: var(--vscode-scrollbarSlider-activeBackground); }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vsc: {
                            bg: 'var(--vsc-bg)',
                            fg: 'var(--vsc-fg)',
                            muted: 'var(--vsc-muted)',
                            border: 'var(--vsc-border)',
                            widget: 'var(--vsc-widget)',
                            button: 'var(--vsc-button-bg)',
                            buttonHover: 'var(--vsc-button-hover)',
                            buttonText: 'var(--vsc-button-fg)',
                            input: 'var(--vsc-input-bg)',
                            inputText: 'var(--vsc-input-fg)',
                            inputBorder: 'var(--vsc-input-border)',
                            link: 'var(--vsc-link)',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- Remix Icons and Material Design Icons for Icon Preview -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet" />
</head>
<body class="flex h-screen flex-col bg-vsc-bg text-vsc-fg font-sans m-0 overflow-hidden">
    <div id="app" class="flex flex-col h-full w-full">
        <!-- Actions Toolbar -->
        <div class="flex flex-wrap items-center justify-between px-4 py-2 gap-2">
            <div class="flex-1 min-w-[200px]">
                {{UPDATED_AT_HTML}}
            </div>
            <div class="flex gap-2 flex-shrink-0 items-center ml-auto">
                <button @click="openStudio" class="px-3 py-1 text-sm bg-vsc-bg hover:bg-vsc-border text-vsc-fg font-medium rounded border border-vsc-border transition-colors flex items-center gap-1.5 shadow-sm" title="Edit in Automa Studio">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M10 21V23H6C4.89543 23 4 22.1046 4 21V3C4 1.89543 4.89543 1 6 1H18C19.1046 1 20 1.89543 20 3V10H18V3H6V21H10ZM15.5355 12.4645C17.4882 10.5118 20.654 10.5118 22.6066 12.4645C24.5592 14.4171 24.5592 17.5829 22.6066 19.5355L21.1924 18.1213C22.3639 16.9497 22.3639 15.0503 21.1924 13.8787C20.0208 12.7071 18.1213 12.7071 16.9497 13.8787L15.5355 12.4645ZM18.4645 21.5355C16.5118 23.4882 13.346 23.4882 11.3934 21.5355C9.44078 19.5829 9.44078 16.4171 11.3934 14.4645L12.8076 15.8787C11.636 17.0503 11.636 18.9497 12.8076 20.1213C13.9792 21.2929 15.8787 21.2929 17.0503 20.1213L18.4645 21.5355ZM14.8284 14.8284L19.0711 19.0711L17.6569 20.4853L13.4142 16.2426L14.8284 14.8284Z"></path></svg>
                    Edit
                </button>
                <button @click="saveWorkflow" class="px-3 py-1 text-sm bg-vsc-bg hover:bg-vsc-border text-vsc-fg font-medium rounded border border-vsc-border transition-colors flex items-center gap-1.5 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M7 19v-6h10v6h2V7.828L16.172 5H5v14h2zM4 3h13l4 4v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm5 12v4h6v-4H9z"/></svg>
                    Save
                </button>
            </div>
        </div>

        <!-- Main Tabs Navigation -->
        <div class="flex border-b border-vsc-border px-4 overflow-x-auto whitespace-nowrap scrollbar-hide">
            <button v-for="tab in tabs" :key="tab.id"
                @click="currentTab = tab.id"
                :class="[
                    'px-3 py-1.5 border-b-2 text-sm font-medium transition-colors flex-shrink-0',
                    currentTab === tab.id ? 'border-vsc-link text-vsc-link' : 'border-transparent text-vsc-muted hover:text-vsc-fg'
                ]">
                {{ tab.label }}
            </button>
        </div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto relative p-4">
            <!-- PACKAGE INTERFACE TAB -->
            <div v-show="currentTab === 'params'" class="max-w-3xl">
                <div class="flex flex-col gap-6">
                    <!-- Inputs -->
                    <div class="flex flex-col gap-2">
                        <h3 class="text-lg font-semibold border-b border-vsc-border pb-1">Inputs</h3>
                        <ul v-if="inputs.length > 0" class="flex flex-col gap-2">
                            <li v-for="inp in inputs" :key="inp.name" class="flex items-center justify-between p-3 bg-vsc-input border border-vsc-inputBorder rounded shadow-sm">
                                <span class="font-medium">{{ inp.name }}</span>
                                <span class="text-xs px-2 py-1 bg-vsc-bg rounded text-vsc-muted font-mono">{{ inp.blockId || 'Unknown' }}</span>
                            </li>
                        </ul>
                        <p v-else class="text-sm text-vsc-muted">No inputs defined.</p>
                    </div>

                    <!-- Outputs -->
                    <div class="flex flex-col gap-2">
                        <h3 class="text-lg font-semibold border-b border-vsc-border pb-1 mt-4">Outputs</h3>
                        <ul v-if="outputs.length > 0" class="flex flex-col gap-2">
                            <li v-for="out in outputs" :key="out.name" class="flex items-center justify-between p-3 bg-vsc-input border border-vsc-inputBorder rounded shadow-sm">
                                <span class="font-medium">{{ out.name }}</span>
                                <span class="text-xs px-2 py-1 bg-vsc-bg rounded text-vsc-muted font-mono">{{ out.blockId || 'Unknown' }}</span>
                            </li>
                        </ul>
                        <p v-else class="text-sm text-vsc-muted">No outputs defined.</p>
                    </div>

                    <!-- Variables -->
                    <div class="flex flex-col gap-2">
                        <h3 class="text-lg font-semibold border-b border-vsc-border pb-1 mt-4">Variables</h3>
                        <ul v-if="variables.length > 0" class="flex flex-col gap-2">
                            <li v-for="v in variables" :key="v.name" class="flex items-center justify-between p-3 bg-vsc-input border border-vsc-inputBorder rounded shadow-sm">
                                <div class="flex flex-col">
                                    <span class="font-medium text-vsc-fg">{{ v.name }}</span>
                                    <span class="text-xs text-vsc-muted">{{ v.type }}</span>
                                </div>
                                <span class="text-xs px-2 py-1 bg-vsc-bg rounded text-vsc-muted font-mono max-w-[200px] truncate" :title="v.value">
                                    {{ v.value }}
                                </span>
                            </li>
                        </ul>
                        <p v-else class="text-sm text-vsc-muted">No variables defined or detected.</p>
                    </div>
                </div>
            </div>

            <form ref="workflowForm">
                <!-- PROPERTIES TAB -->
                <div v-show="currentTab === 'properties'" class="max-w-3xl">
                    <div class="flex flex-col gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">ID</label>
                            <input type="text" value="{{JSON_ID}}" readonly class="w-full px-3 py-2 bg-vsc-input text-vsc-muted border border-vsc-inputBorder rounded cursor-not-allowed focus:outline-none">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Name</label>
                            <input type="text" name="name" v-model="workflow.name" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded focus:outline-none focus:border-vsc-button">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Description</label>
                            <textarea name="description" v-model="workflow.description" rows="3" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded text-sm focus:outline-none focus:border-vsc-button"></textarea>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Icon</label>
                            <div class="flex items-center gap-2">
                                <div class="flex-shrink-0 w-9 h-9 rounded bg-vsc-input border border-vsc-inputBorder flex items-center justify-center text-vsc-fg text-xl shadow-sm">
                                    <i :class="iconClass"></i>
                                </div>
                                <select name="icon" v-model="workflow.icon" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded focus:outline-none focus:border-vsc-button appearance-none cursor-pointer">
                                    <option v-for="icon in iconsList" :key="icon" :value="icon">{{ icon }}</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SETTINGS TAB -->
                <div v-show="currentTab === 'settings'" class="max-w-3xl">
                    <div class="flex flex-col gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Settings (JSON)</label>
                            <textarea name="settings" v-model="workflow.settings" rows="6" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded font-mono text-sm focus:outline-none focus:border-vsc-button"></textarea>
                        </div>
                    </div>
                </div>
            </form>
        <!-- Error Banner overlay -->
        <div v-if="jsonError" class="absolute bottom-4 left-4 right-4 p-3 border border-red-900 bg-red-900/90 text-red-200 rounded text-sm font-mono flex items-start gap-2 shadow-lg z-10 backdrop-blur-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="mt-0.5" width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22ZM11 15V17H13V15H11ZM11 7V13H13V7H11Z"></path></svg>
            <div>{{ jsonError }}</div>
        </div>
    </div>

    <script>{{INJECT_PACKAGE_DATA}}
        const vscode = acquireVsCodeApi();

        const { createApp, ref, reactive, computed, watch } = Vue;

        createApp({
            setup() {
                const previousState = vscode.getState() || {};
                const currentTab = ref(previousState.currentTab || 'params');
                const jsonError = ref(null);
                const tabs = [
                    { id: 'params', label: 'Package Interface' },
                    { id: 'settings', label: 'Settings' },
                    { id: 'properties', label: 'Properties' }
                ];
                
                watch(currentTab, (newTab) => {
                    const state = vscode.getState() || {};
                    vscode.setState({ ...state, currentTab: newTab });
                });

                const inputs = ref(typeof pInputs !== 'undefined' ? pInputs : []);
                const outputs = ref(typeof pOutputs !== 'undefined' ? pOutputs : []);
                const pVarsList = ref(typeof pVars !== 'undefined' ? pVars : []);
                const tParamsList = ref(typeof tParams !== 'undefined' ? tParams : []);
                
                const variables = computed(() => {
                    const vars = [];
                    
                    pVarsList.value.forEach(v => {
                        vars.push({
                            name: v.name,
                            type: 'Explicit Variable',
                            value: v.value || '""'
                        });
                    });
                    
                    tParamsList.value.forEach(v => {
                        if (!pVarsList.value.some(pv => pv.name === v.name)) {
                            vars.push({
                                name: v.name,
                                type: v.description || 'Implicit',
                                value: v.defaultValue || '""'
                            });
                        }
                    });
                    
                    return vars;
                });

                const normalizeJsonStr = (str) => {
                    if (!str || typeof str !== 'string') return str || '';
                    try {
                        return JSON.stringify(JSON.parse(str), null, 2);
                    } catch(e) {
                        return str;
                    }
                };

                let currentDocState = {
                    name: `{{JSON_NAME}}`,
                    description: `{{JSON_DESCRIPTION}}`,
                    icon: `{{JSON_ICON}}` || 'riGlobalLine',
                    settings: normalizeJsonStr(`{{JSON_SETTINGS}}`.trim() === "" ? "{}" : `{{JSON_SETTINGS}}`)
                };

                let workflowData = currentDocState;
                if (previousState.lastDocState && JSON.stringify(previousState.lastDocState) === JSON.stringify(currentDocState)) {
                    if (previousState.workflow) {
                        workflowData = previousState.workflow;
                    }
                }

                const workflow = reactive(workflowData);

                Vue.onMounted(() => {
                    window.addEventListener('message', event => {
                        const message = event.data;
                        if (message.type === 'update' && message.json) {
                            currentDocState = {
                                name: message.json.name || '',
                                description: message.json.description || '',
                                icon: message.json.icon || 'riGlobalLine',
                                settings: message.json.settings ? normalizeJsonStr(JSON.stringify(message.json.settings)) : "{}"
                            };

                            workflow.name = currentDocState.name;
                            workflow.description = currentDocState.description;
                            workflow.icon = currentDocState.icon;
                            workflow.settings = currentDocState.settings;
                            
                            inputs.value = Array.isArray(message.json.inputs) ? message.json.inputs : [];
                            outputs.value = Array.isArray(message.json.outputs) ? message.json.outputs : [];
                            pVarsList.value = Array.isArray(message.json.variable) ? message.json.variable : [];
                            
                            if (message.triggerParams) {
                                tParamsList.value = message.triggerParams;
                            }
                        }
                    });
                });

                watch(workflow, (newVal) => {
                    const state = vscode.getState() || {};
                    vscode.setState({ ...state, workflow: JSON.parse(JSON.stringify(newVal)), lastDocState: currentDocState });
                }, { deep: true });

                const iconsList = ref([
                    'mdiPackageVariantClosed', 'riGlobalLine', 'riFileTextLine', 'riEqualizerLine', 'riTimerLine', 'riCalendarLine', 'riFlashlightLine', 'riLightbulbFlashLine', 'riDatabase2Line', 'riWindowLine', 'riCursorLine', 'riDownloadLine', 'riCommandLine'
                ]);

                if (workflow.icon && !iconsList.value.includes(workflow.icon)) {
                    iconsList.value.push(workflow.icon);
                }

                const camelToKebab = (str) => {
                    return str.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                };

                const iconClass = computed(() => {
                    const kebab = camelToKebab(workflow.icon);
                    if (workflow.icon.startsWith('mdi')) {
                        return `mdi ${kebab}`;
                    }
                    return kebab;
                });

                const saveWorkflow = () => {
                    // Validate JSON fields first
                    const jsonFields = ['settings'];
                    for (const field of jsonFields) {
                        if (workflow[field] && typeof workflow[field] === 'string') {
                            try {
                                JSON.parse(workflow[field]);
                            } catch (e) {
                                jsonError.value = `Cannot save: Invalid JSON in ${field}`;
                                setTimeout(() => { jsonError.value = null; }, 5000);
                                return;
                            }
                        }
                    }

                    jsonError.value = null;
                    const dataToSave = JSON.parse(JSON.stringify(workflow));
                    
                    dataToSave.settings = dataToSave.settings.trim() === "" ? "{}" : dataToSave.settings;

                    const state = vscode.getState() || {};
                    const newDocState = {
                        name: dataToSave.name,
                        description: dataToSave.description,
                        icon: dataToSave.icon,
                        settings: normalizeJsonStr(dataToSave.settings)
                    };
                    vscode.setState({ ...state, lastDocState: newDocState });

                    vscode.postMessage({
                        command: 'saveWorkflow',
                        data: dataToSave
                    });
                };

                const openStudio = () => {
                    vscode.postMessage({
                        command: 'openInStudio'
                    });
                };

                return {
                    currentTab,
                    tabs,
                    inputs,
                    outputs,
                    variables,
                    workflow,
                    iconsList,
                    iconClass,
                    saveWorkflow,
                    openStudio,
                    jsonError
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
