<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --vsc-bg: var(--vscode-editor-background);
            --vsc-fg: var(--vscode-editor-foreground);
            --vsc-muted: var(--vscode-descriptionForeground);
            --vsc-border: var(--vscode-panel-border);
            --vsc-widget: var(--vscode-editorWidget-background);
            --vsc-button-bg: var(--vscode-button-background);
            --vsc-button-fg: var(--vscode-button-foreground);
            --vsc-button-hover: var(--vscode-button-hoverBackground);
            --vsc-input-bg: var(--vscode-input-background);
            --vsc-input-fg: var(--vscode-input-foreground);
            --vsc-input-border: var(--vscode-input-border);
            --vsc-link: var(--vscode-textLink-foreground);
        }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--vsc-bg);
            color: var(--vsc-fg);
            font-family: var(--vscode-font-family), -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--vscode-scrollbarSlider-background); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--vscode-scrollbarSlider-hoverBackground); }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vsc: {
                            bg: 'var(--vsc-bg)',
                            fg: 'var(--vsc-fg)',
                            muted: 'var(--vsc-muted)',
                            border: 'var(--vsc-border)',
                            widget: 'var(--vsc-widget)',
                            button: 'var(--vsc-button-bg)',
                            buttonHover: 'var(--vsc-button-hover)',
                            buttonText: 'var(--vsc-button-fg)',
                            input: 'var(--vsc-input-bg)',
                            inputText: 'var(--vsc-input-fg)',
                            inputBorder: 'var(--vsc-input-border)',
                            link: 'var(--vsc-link)',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <style>
        .CodeMirror {
            height: auto;
            min-height: 120px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 13px;
            background-color: var(--vsc-input-bg);
            color: var(--vsc-input-fg);
        }
        .CodeMirror-scroll { min-height: 120px; }
        .CodeMirror-gutters {
            background-color: var(--vsc-widget);
            border-right: 1px solid var(--vsc-border);
        }
        .CodeMirror-linenumber { color: var(--vsc-muted); }
        .CodeMirror-cursor { border-left-color: var(--vsc-fg); }
        .CodeMirror-selected { background: var(--vscode-editor-selectionBackground, #264f78); }
        .cm-s-default .cm-property { color: #9CDCFE; }
        .cm-s-default .cm-string { color: #CE9178; }
        .cm-s-default .cm-number { color: #B5CEA8; }
        .cm-s-default .cm-keyword { color: #569CD6; }
        .cm-s-default .cm-atom { color: #569CD6; }
    </style>
</head>
<body class="flex flex-col bg-vsc-bg text-vsc-fg font-sans m-0 h-screen overflow-hidden">
    <div id="app" class="flex flex-col h-full w-full">
        <!-- Actions Toolbar -->
        <div class="flex flex-wrap items-center justify-between px-4 py-2 gap-2 border-b border-vsc-border bg-vsc-widget">
            <div class="flex-1 min-w-[200px] flex items-center gap-2 text-sm text-vsc-muted">
                <span class="text-[10px] px-1.5 py-0.5 bg-vsc-button text-vsc-buttonText rounded-sm shadow-sm font-medium leading-none uppercase tracking-wide">Fleet</span>
                <span>Concurrency:</span>
                <select v-if="fleetData && fleetData.settings" v-model="fleetData.settings.concurrency_mode" @change="markModified" class="bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded px-1.5 py-0.5 text-xs font-mono focus:outline-none focus:border-vsc-link transition-colors">
                    <option value="queue">queue</option>
                    <option value="parallel">parallel</option>
                    <option value="skip">skip</option>
                </select>
            </div>
            
            <div class="flex gap-2 flex-shrink-0 items-center ml-auto">
                <button v-if="isModified" @click="saveChanges" class="px-3 py-1 text-sm bg-amber-600 hover:bg-amber-700 text-white font-medium rounded shadow transition-colors flex items-center gap-1.5 mr-1">
                    <i class="ri-save-line text-sm"></i> Save
                </button>
                <button @click="stopFleet" :disabled="!isRunning" 
                    :class="['px-3 py-1 text-sm font-medium rounded border transition-colors flex items-center gap-1.5', 
                    isRunning ? 'bg-red-600 hover:bg-red-700 text-white border-transparent' : 'bg-vsc-bg text-vsc-muted border-vsc-border cursor-not-allowed']">
                    <i class="ri-stop-circle-line text-sm"></i> Stop
                </button>
                <button @click="runFleet" :disabled="isRunning"
                    :class="['px-3 py-1 text-sm font-medium rounded shadow transition-colors flex items-center gap-1.5',
                    isRunning ? 'bg-vsc-bg text-vsc-muted cursor-not-allowed border border-vsc-border' : 'bg-vsc-button hover:bg-vsc-buttonHover text-vsc-buttonText']">
                    <i class="ri-play-circle-line text-sm"></i> Run
                </button>
            </div>
        </div>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto p-4">
            <div v-if="!fleetData" class="text-center text-vsc-muted mt-10">
                Loading Fleet Data...
            </div>
            <div v-else class="max-w-6xl mx-auto space-y-6">
                <!-- Global Variables -->
                <div v-if="hasGlobalVariables" class="border border-vsc-border rounded-lg bg-vsc-widget p-4">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-lg font-semibold flex items-center gap-2"><i class="ri-global-line"></i> Global Variables</h2>
                        <button @click="formatJson" class="text-xs text-vsc-link hover:underline">Format JSON</button>
                    </div>
                    <json-editor v-model="globalVariablesStr" min-height="120px"></json-editor>
                    <div v-if="jsonError" class="mt-2 text-xs text-red-500 font-mono">{{ jsonError }}</div>
                </div>

                <!-- Members -->
                <div class="grid grid-cols-1 xl:grid-cols-2 gap-4 items-start">
                    <div class="flex justify-between items-center col-span-full mb-2">
                        <h2 class="text-lg font-semibold flex items-center gap-2"><i class="ri-group-line"></i> Browser Members ({{ members.length }})</h2>
                        <button @click="addMember" class="text-xs text-vsc-buttonText bg-vsc-button hover:bg-vsc-buttonHover px-2 py-1 rounded shadow-sm transition-colors flex items-center gap-1">
                            <i class="ri-add-line"></i> Add Member
                        </button>
                    </div>
                    
                    <div v-for="member in members" :key="member.browser_id" class="border border-vsc-border rounded-lg bg-vsc-widget overflow-hidden shadow-sm">
                        <!-- Member Header -->
                        <div @click="toggleMember(member.browser_id)" class="bg-vsc-bg px-4 py-3 border-b border-vsc-border flex justify-between items-center cursor-pointer hover:bg-vsc-widget transition-colors">
                            <div class="flex items-center gap-3">
                                <i class="ri-window-line text-xl text-vsc-link"></i>
                                <div>
                                    <h3 class="font-semibold text-lg flex items-center gap-2">
                                        <select v-model="member.browser_id" @change="markModified" @click.stop class="bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded px-2 py-1 text-base font-semibold focus:outline-none focus:border-vsc-link transition-colors max-w-sm">
                                            <option v-for="(name, id) in profileDict" :key="id" :value="id">{{ name }} ({{ id }})</option>
                                            <option v-if="!profileDict[member.browser_id]" :value="member.browser_id">[Missing] {{ member.browser_id }}</option>
                                        </select>
                                        <span class="text-xs bg-vsc-widget px-2 py-0.5 rounded border border-vsc-border text-vsc-muted">{{ (member.tasks || []).length }} Tasks</span>
                                    </h3>
                                    <input type="text" v-model="member.description" @input="markModified" @click.stop placeholder="Profile description..." class="bg-transparent border-none focus:outline-none text-xs text-vsc-muted w-full" />
                                </div>
                            </div>
                            <div class="flex gap-2 items-center">
                                <button @click.stop="removeMember(member)" class="text-vsc-muted hover:text-red-500 transition-colors px-1" title="Delete Member"><i class="ri-delete-bin-line text-lg"></i></button>
                                <i :class="['ri-arrow-down-s-line text-xl text-vsc-muted transition-transform', isCollapsed(member.browser_id) ? '-rotate-90' : '']"></i>
                            </div>
                        </div>
                        
                        <!-- Member Tasks -->
                        <div v-show="!isCollapsed(member.browser_id)" class="p-4 bg-vsc-widget">
                            <h4 class="text-sm font-semibold text-vsc-muted mb-3 uppercase tracking-wider">Tasks ({{ (member.tasks || []).length }})</h4>
                            
                            <div class="space-y-3 relative">
                                <div v-if="!member.tasks || member.tasks.length === 0" class="text-sm text-vsc-muted italic">
                                    No tasks assigned to this browser.
                                </div>
                                <div v-for="task in member.tasks" :key="task.task_id" class="relative pl-6">
                                    <!-- Dependency Arrow Line -->
                                    <div class="absolute left-2.5 top-0 bottom-0 border-l border-vsc-border border-dashed z-0" v-if="member.tasks.length > 1"></div>
                                    <div class="absolute left-1 top-4 w-3 h-3 bg-vsc-border rounded-full z-10 border-2 border-vsc-widget"></div>

                                    <div class="border border-vsc-border rounded bg-vsc-bg p-3 hover:border-vsc-link transition-colors z-20 relative group">
                                        <!-- Delete Task Button -->
                                        <button @click="removeTask(member, task)" class="absolute top-2 right-2 text-vsc-muted hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity" title="Delete Task"><i class="ri-delete-bin-line"></i></button>

                                        <div class="flex justify-between items-start pr-6">
                                            <div class="flex-1 mr-4">
                                                <input type="text" v-model="task.name" @input="markModified" placeholder="Task Name..." class="font-semibold text-base bg-transparent border-none focus:outline-none w-full text-vsc-fg placeholder-vsc-muted/50" />
                                                <div class="text-xs text-vsc-muted font-mono mt-1 flex flex-col gap-1">
                                                    <span>Workflow: 
                                                        <select v-model="task.workflow_id" @change="markModified" class="bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded px-1 py-0.5 text-xs font-semibold focus:outline-none focus:border-vsc-link transition-colors w-48">
                                                            <option v-for="(name, id) in workflowDict" :key="id" :value="id">{{ name }} ({{ id }})</option>
                                                            <option v-if="!workflowDict[task.workflow_id]" :value="task.workflow_id">[Missing] {{ task.workflow_id }}</option>
                                                        </select>
                                                    </span>
                                                    <span class="mt-1 flex items-center gap-1">Task ID: 
                                                        <input type="text" v-model="task.task_id" @input="markModified" class="bg-vsc-input text-vsc-inputText border-none rounded px-1 py-0.5 focus:outline-none focus:bg-vsc-widget transition-colors flex-1 min-w-[150px]" />
                                                    </span>
                                                    <span class="mt-1 flex items-center gap-1">Depends On: 
                                                        <input type="text" :value="(task.depends_on || []).join(', ')" @change="updateDependencies(task, $event.target.value)" placeholder="tsk_1, tsk_2..." class="bg-vsc-input text-vsc-inputText border-none rounded px-1 py-0.5 focus:outline-none focus:bg-vsc-widget transition-colors flex-1" />
                                                    </span>
                                                </div>
                                            </div>
                                            <!-- Schedule Editor -->
                                            <div class="flex flex-col gap-2 items-end">
                                                <div class="flex items-center gap-1 bg-vsc-bg border border-vsc-border rounded px-1 py-1 focus-within:border-vsc-link transition-colors">
                                                    <i :class="getScheduleIcon(task.schedule?.type) + ' text-vsc-muted ml-1'"></i>
                                                    <select v-if="task.schedule" v-model="task.schedule.type" @change="markModified" class="bg-transparent text-vsc-fg border-none text-xs focus:outline-none cursor-pointer px-1">
                                                        <option value="on-start">on-start</option>
                                                        <option value="cron">cron</option>
                                                        <option value="delay">delay</option>
                                                        <option value="once">once</option>
                                                    </select>
                                                    <input v-if="task.schedule && task.schedule.type !== 'on-start'" type="text" v-model="task.schedule.value" @input="markModified" placeholder="Value..." 
                                                        class="bg-vsc-input text-vsc-inputText border-none rounded-sm px-1.5 py-0.5 text-xs font-mono focus:outline-none focus:bg-vsc-widget transition-colors w-24" />
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- Add Task Button -->
                            <div class="mt-4 flex justify-center">
                                <button @click="addTask(member)" class="text-xs text-vsc-muted hover:text-vsc-link border border-vsc-border border-dashed hover:border-vsc-link bg-vsc-bg px-4 py-1.5 rounded transition-colors flex items-center gap-1 w-full justify-center">
                                    <i class="ri-add-line"></i> Add Task
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();

        const { createApp, ref, onMounted, watch } = Vue;

        const JsonEditor = {
            props: {
                modelValue: String,
                minHeight: { type: String, default: '120px' }
            },
            emits: ['update:modelValue'],
            template: `<div ref="editorContainer" class="w-full border border-vsc-inputBorder rounded overflow-hidden focus-within:border-vsc-button transition-colors"></div>`,
            setup(props, { emit }) {
                const editorContainer = ref(null);
                let editor = null;
                let isInternalChange = false;

                onMounted(() => {
                    editor = CodeMirror(editorContainer.value, {
                        value: props.modelValue || '',
                        mode: { name: "javascript", json: true },
                        lineNumbers: true,
                        tabSize: 2,
                        lineWrapping: true,
                        viewportMargin: Infinity
                    });

                    if (editorContainer.value) {
                        const cmEl = editorContainer.value.querySelector('.CodeMirror');
                        if (cmEl) {
                            cmEl.style.minHeight = props.minHeight;
                        }
                    }

                    editor.on('change', () => {
                        isInternalChange = true;
                        emit('update:modelValue', editor.getValue());
                        setTimeout(() => { isInternalChange = false; }, 0);
                    });
                    
                    const observer = new IntersectionObserver((entries) => {
                        if (entries[0].isIntersecting && editor) {
                            setTimeout(() => editor.refresh(), 10);
                        }
                    });
                    observer.observe(editorContainer.value);
                });

                watch(() => props.modelValue, (newVal) => {
                    if (editor && !isInternalChange && editor.getValue() !== newVal) {
                        editor.setValue(newVal || '');
                    }
                });

                return { editorContainer };
            }
        };

        const app = createApp({
            data() {
                const state = vscode.getState() || {};
                return {
                    fleetData: null,
                    workflowDict: {},
                    profileDict: {},
                    isRunning: false,
                    isModified: false,
                    collapsedMembers: state.collapsedMembers || [],
                    globalVariablesStr: '{}',
                    isInternalVarUpdate: false,
                    jsonError: null
                }
            },
            computed: {
                fleetName() {
                    return this.fleetData?.name || this.fleetData?.fleet_id || 'Unknown Fleet';
                },
                concurrencyMode() {
                    return this.fleetData?.settings?.concurrency_mode || 'queue';
                },
                members() {
                    return this.fleetData?.members || [];
                },
                hasGlobalVariables() {
                    // Always return true to let users add global vars from scratch if they want
                    return true;
                }
            },
            watch: {
                fleetData: {
                    deep: true,
                    handler(newVal) {
                        const state = vscode.getState() || {};
                        if (newVal) {
                            vscode.setState({ ...state, fleetData: JSON.parse(JSON.stringify(newVal)) });
                        }
                    }
                },
                collapsedMembers: {
                    deep: true,
                    handler(newVal) {
                        const state = vscode.getState() || {};
                        vscode.setState({ ...state, collapsedMembers: [...newVal] });
                    }
                },
                isModified(newVal) {
                    const state = vscode.getState() || {};
                    vscode.setState({ ...state, isModified: newVal });
                },
                globalVariablesStr(newVal) {
                    if (this.isInternalVarUpdate) return;
                    try {
                        const parsed = JSON.parse(newVal);
                        this.jsonError = null;
                        if (this.fleetData) {
                            this.fleetData.global_variables = parsed;
                            this.markModified();
                        }
                    } catch (e) {
                        this.jsonError = e.message;
                    }
                }
            },
            methods: {
                runFleet() {
                    this.isRunning = true;
                    vscode.postMessage({ type: 'run-fleet' });
                    setTimeout(() => { this.isRunning = false; }, 3000);
                },
                stopFleet() {
                    this.isRunning = false;
                    vscode.postMessage({ type: 'stop-fleet' });
                },
                getScheduleIcon(type) {
                    switch(type) {
                        case 'cron': return 'ri-calendar-event-line';
                        case 'once': return 'ri-time-line';
                        case 'delay': return 'ri-timer-line';
                        case 'on-start': return 'ri-flashlight-line';
                        default: return 'ri-question-line';
                    }
                },
                getScheduleText(schedule) {
                    if (!schedule) return 'No schedule';
                    if (schedule.type === 'on-start') return 'On Start';
                    return `${schedule.type}: ${schedule.value}`;
                },
                toggleMember(id) {
                    const idx = this.collapsedMembers.indexOf(id);
                    if (idx > -1) {
                        this.collapsedMembers.splice(idx, 1);
                    } else {
                        this.collapsedMembers.push(id);
                    }
                },
                isCollapsed(id) {
                    return this.collapsedMembers.includes(id);
                },
                markModified() {
                    this.isModified = true;
                },
                formatJson() {
                    try {
                        const parsed = JSON.parse(this.globalVariablesStr);
                        this.globalVariablesStr = JSON.stringify(parsed, null, 2);
                        this.jsonError = null;
                    } catch (e) {
                        this.jsonError = e.message;
                    }
                },
                saveChanges() {
                    if (this.jsonError) {
                        vscode.postMessage({ type: 'error', text: 'Cannot save: Global Variables contains invalid JSON.' });
                        return;
                    }
                    this.isModified = false;
                    vscode.postMessage({ 
                        type: 'save-fleet', 
                        data: JSON.stringify(this.fleetData, null, 2) 
                    });
                },
                getWorkflowName(id) {
                    return this.workflowDict[id] || 'Unknown Workflow';
                },
                addMember() {
                    if (!this.fleetData) return;
                    if (!this.fleetData.members) this.fleetData.members = [];
                    const newId = this.generateId('profile');
                    this.fleetData.members.push({
                        browser_id: newId,
                        description: "",
                        tasks: []
                    });
                    this.markModified();
                },
                removeMember(member) {
                    if (confirm(`Remove member ${member.browser_id}?`)) {
                        const idx = this.fleetData.members.indexOf(member);
                        if (idx > -1) {
                            this.fleetData.members.splice(idx, 1);
                            this.markModified();
                        }
                    }
                },
                addTask(member) {
                    if (!member.tasks) member.tasks = [];
                    member.tasks.push({
                        task_id: this.generateId('tsk'),
                        name: "New Task",
                        workflow_id: "",
                        schedule: { type: 'on-start' }
                    });
                    this.markModified();
                },
                removeTask(member, task) {
                    const idx = member.tasks.indexOf(task);
                    if (idx > -1) {
                        member.tasks.splice(idx, 1);
                        this.markModified();
                    }
                },
                updateDependencies(task, val) {
                    if (!val.trim()) {
                        delete task.depends_on;
                    } else {
                        task.depends_on = val.split(',').map(s => s.trim()).filter(Boolean);
                    }
                    this.markModified();
                },
                generateId(prefix) {
                    return `${prefix}_${Math.random().toString(36).substring(2, 9)}`;
                }
            },
            mounted() {
                window.addEventListener('message', event => {
                    const message = event.data;
                    switch (message.type) {
                        case 'update':
                            try {
                                const newFleetData = JSON.parse(message.text);
                                const state = vscode.getState() || {};

                                if (state.lastDocumentData === message.text && state.fleetData) {
                                    this.fleetData = state.fleetData;
                                    this.isModified = state.isModified || false;
                                } else {
                                    this.fleetData = newFleetData;
                                    this.isModified = false;
                                }
                                
                                vscode.setState({ ...state, lastDocumentData: message.text, fleetData: JSON.parse(JSON.stringify(this.fleetData)), isModified: this.isModified });

                                if (message.workflows) {
                                    this.workflowDict = message.workflows;
                                }
                                if (message.profiles) {
                                    this.profileDict = message.profiles;
                                }
                                
                                this.isInternalVarUpdate = true;
                                this.globalVariablesStr = JSON.stringify(this.fleetData.global_variables || {}, null, 2);
                                this.jsonError = null;
                                setTimeout(() => { this.isInternalVarUpdate = false; }, 50);
                                
                            } catch(e) {
                                console.error("Failed to parse fleet data", e);
                            }
                            break;
                    }
                });
                vscode.postMessage({ type: 'ready' });
            }
        });
        
        app.component('json-editor', JsonEditor);
        app.mount('#app');
    </script>
</body>
</html>
