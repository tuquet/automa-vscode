<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Quick Edit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Theme configuration to map VS Code colors to Tailwind */
        :root {
            --vsc-bg: var(--vscode-editor-background);
            --vsc-fg: var(--vscode-editor-foreground);
            --vsc-muted: var(--vscode-descriptionForeground);
            --vsc-border: var(--vscode-panel-border);
            --vsc-widget: var(--vscode-editorWidget-background);
            --vsc-button-bg: var(--vscode-button-background);
            --vsc-button-fg: var(--vscode-button-foreground);
            --vsc-button-hover: var(--vscode-button-hoverBackground);
            --vsc-input-bg: var(--vscode-input-background);
            --vsc-input-fg: var(--vscode-input-foreground);
            --vsc-input-border: var(--vscode-input-border);
            --vsc-link: var(--vscode-textLink-foreground);
        }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--vsc-bg);
            color: var(--vsc-fg);
            font-family: var(--vscode-font-family), -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--vscode-scrollbarSlider-background); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--vscode-scrollbarSlider-hoverBackground); }
        ::-webkit-scrollbar-thumb:active { background: var(--vscode-scrollbarSlider-activeBackground); }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vsc: {
                            bg: 'var(--vsc-bg)',
                            fg: 'var(--vsc-fg)',
                            muted: 'var(--vsc-muted)',
                            border: 'var(--vsc-border)',
                            widget: 'var(--vsc-widget)',
                            button: 'var(--vsc-button-bg)',
                            buttonHover: 'var(--vsc-button-hover)',
                            buttonText: 'var(--vsc-button-fg)',
                            input: 'var(--vsc-input-bg)',
                            inputText: 'var(--vsc-input-fg)',
                            inputBorder: 'var(--vsc-input-border)',
                            link: 'var(--vsc-link)',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- Remix Icons and Material Design Icons for Icon Preview -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet" />
</head>
<body class="flex h-screen flex-col bg-vsc-bg text-vsc-fg font-sans m-0 overflow-hidden">
    <div id="app" class="flex flex-col h-full w-full">
        <!-- Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-vsc-border">
            <div>
                <h1 class="text-2xl font-semibold text-vsc-fg truncate max-w-lg" title="{{WORKFLOW_NAME}}">{{WORKFLOW_NAME}}</h1>
                {{UPDATED_AT_HTML}}
            </div>
            
            <div class="flex gap-3 flex-shrink-0">
                <button @click="openStudio" class="px-6 py-2 bg-vsc-bg hover:bg-vsc-border text-vsc-fg font-semibold rounded border border-vsc-border transition-colors flex items-center gap-2 shadow-sm" title="Open in Automa Studio (Browser Extension)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M10 21V23H6C4.89543 23 4 22.1046 4 21V3C4 1.89543 4.89543 1 6 1H18C19.1046 1 20 1.89543 20 3V10H18V3H6V21H10ZM15.5355 12.4645C17.4882 10.5118 20.654 10.5118 22.6066 12.4645C24.5592 14.4171 24.5592 17.5829 22.6066 19.5355L21.1924 18.1213C22.3639 16.9497 22.3639 15.0503 21.1924 13.8787C20.0208 12.7071 18.1213 12.7071 16.9497 13.8787L15.5355 12.4645ZM18.4645 21.5355C16.5118 23.4882 13.346 23.4882 11.3934 21.5355C9.44078 19.5829 9.44078 16.4171 11.3934 14.4645L12.8076 15.8787C11.636 17.0503 11.636 18.9497 12.8076 20.1213C13.9792 21.2929 15.8787 21.2929 17.0503 20.1213L18.4645 21.5355ZM14.8284 14.8284L19.0711 19.0711L17.6569 20.4853L13.4142 16.2426L14.8284 14.8284Z"></path></svg>
                    Studio
                </button>
                <button @click="saveWorkflow" class="px-6 py-2 bg-vsc-bg hover:bg-vsc-border text-vsc-fg font-semibold rounded border border-vsc-border transition-colors flex items-center gap-2 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M7 19v-6h10v6h2V7.828L16.172 5H5v14h2zM4 3h13l4 4v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm5 12v4h6v-4H9z"/></svg>
                    Save
                </button>
                <button @click="runWorkflow" class="px-6 py-2 bg-vsc-button hover:bg-vsc-buttonHover text-vsc-buttonText font-semibold rounded shadow transition-colors flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M19.376 12.416L8.777 19.482A.5.5 0 0 1 8 19.066V4.934a.5.5 0 0 1 .777-.416l10.599 7.066a.5.5 0 0 1 0 .832z"/></svg>
                    Run
                </button>
            </div>
        </div>

        <!-- Main Tabs Navigation -->
        <div class="flex border-b border-vsc-border px-6 mt-2">
            <button v-for="tab in tabs" :key="tab.id"
                @click="currentTab = tab.id"
                :class="[
                    'px-4 py-2 border-b-2 font-medium',
                    currentTab === tab.id ? 'border-vsc-link text-vsc-link' : 'border-transparent text-vsc-muted hover:text-vsc-fg'
                ]">
                {{ tab.label }}
            </button>
        </div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto relative p-6">
            <!-- PARAMS TAB -->
            <div v-show="currentTab === 'params'" class="max-w-3xl">
                <form ref="paramsForm" @submit.prevent="runWorkflow" class="flex flex-col gap-4">
                    <div v-if="triggerParams.length === 0" class="flex flex-col items-center justify-center text-vsc-muted mt-20">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" viewBox="0 0 24 24" class="mb-4"><path d="M11 2.04938V12H2.04938C2.55294 17.0673 6.83067 21 12 21C16.9706 21 21 16.9706 21 12C21 7.02944 16.9706 3 12 3C11.6621 3 11.3286 3.01669 11 2.04938ZM13 1.95062C17.4471 2.45422 21 6.33159 21 11H13V1.95062Z"></path></svg>
                        <p class="text-lg">No trigger parameters found.</p>
                    </div>

                    <!-- Explicit Parameters -->
                    <div v-if="explicitParams.length > 0">
                        <h3 class="text-xs font-semibold text-vsc-muted uppercase tracking-wider mb-3">Workflow Parameters</h3>
                        <div v-for="param in explicitParams" :key="param.name" class="flex flex-col gap-1 mb-4">
                            <label class="text-sm font-medium text-vsc-fg">
                                {{ param.name }}
                                <span v-if="param.required" class="text-red-500 ml-1">*</span>
                            </label>
                            <input :type="param.type === 'number' ? 'number' : 'text'" :required="param.required" v-model="paramValues[param.name]" placeholder="Enter value..." 
                                class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded focus:outline-none focus:border-vsc-button">
                            <p v-if="param.description" class="text-xs text-vsc-muted">{{ param.description }}</p>
                        </div>
                    </div>

                    <!-- Implicit/Global Variables -->
                    <div v-if="implicitParams.length > 0">
                        <h3 class="text-xs font-semibold text-vsc-muted uppercase tracking-wider mb-3 mt-4 border-t border-vsc-border pt-4">Derived / Global Variables</h3>
                        <div v-for="param in implicitParams" :key="param.name" class="flex flex-col gap-1 mb-4">
                            <label class="text-sm font-medium text-vsc-fg opacity-80">{{ param.name }}</label>
                            <input type="text" v-model="paramValues[param.name]" placeholder="Enter value..." 
                                class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded opacity-80 focus:outline-none focus:border-vsc-button">
                            <p v-if="param.description" class="text-xs text-vsc-muted">{{ param.description }}</p>
                        </div>
                    </div>
                    <button type="submit" class="hidden">Submit</button>
                </form>
            </div>

            <form ref="workflowForm">
                <!-- PROPERTIES TAB -->
                <div v-show="currentTab === 'properties'" class="max-w-3xl">
                    <div class="flex flex-col gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">ID</label>
                            <input type="text" value="{{JSON_ID}}" readonly class="w-full px-3 py-2 bg-vsc-input text-vsc-muted border border-vsc-inputBorder rounded cursor-not-allowed focus:outline-none">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Name</label>
                            <input type="text" name="name" v-model="workflow.name" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded focus:outline-none focus:border-vsc-button">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Description</label>
                            <textarea name="description" v-model="workflow.description" rows="3" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded text-sm focus:outline-none focus:border-vsc-button"></textarea>
                        </div>
                        <div class="flex gap-4">
                            <div class="flex flex-col gap-1 flex-1">
                                <label class="text-xs text-vsc-fg">Version</label>
                                <input type="text" name="version" v-model="workflow.version" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded focus:outline-none focus:border-vsc-button">
                            </div>
                            <div class="flex flex-col gap-1 flex-1">
                                <label class="text-xs text-vsc-fg">ExtVersion</label>
                                <input type="text" name="extVersion" v-model="workflow.extVersion" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded focus:outline-none focus:border-vsc-button">
                            </div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Icon</label>
                            <div class="flex items-center gap-2">
                                <div class="flex-shrink-0 w-9 h-9 rounded bg-vsc-input border border-vsc-inputBorder flex items-center justify-center text-vsc-fg text-xl shadow-sm">
                                    <i :class="iconClass"></i>
                                </div>
                                <select name="icon" v-model="workflow.icon" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded focus:outline-none focus:border-vsc-button appearance-none cursor-pointer">
                                    <option v-for="icon in iconsList" :key="icon" :value="icon">{{ icon }}</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- GLOBAL DATA TAB -->
                <div v-show="currentTab === 'global-data'" class="max-w-3xl">
                    <div class="flex flex-col gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Global Data (String/JSON)</label>
                            <textarea name="globalData" v-model="workflow.globalData" rows="4" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded font-mono text-sm focus:outline-none focus:border-vsc-button"></textarea>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Table (JSON Array)</label>
                            <textarea name="table" v-model="workflow.table" rows="5" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded font-mono text-sm focus:outline-none focus:border-vsc-button"></textarea>
                        </div>
                    </div>
                </div>

                <!-- SETTINGS TAB -->
                <div v-show="currentTab === 'settings'" class="max-w-3xl">
                    <div class="flex flex-col gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Settings (JSON)</label>
                            <textarea name="settings" v-model="workflow.settings" rows="6" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded font-mono text-sm focus:outline-none focus:border-vsc-button"></textarea>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Included Workflows (JSON)</label>
                            <textarea name="includedWorkflows" v-model="workflow.includedWorkflows" rows="4" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded font-mono text-sm focus:outline-none focus:border-vsc-button"></textarea>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        {{INJECT_PARAMS_DATA}}
        const vscode = acquireVsCodeApi();

        const { createApp, ref, reactive, computed } = Vue;

        createApp({
            setup() {
                const currentTab = ref('params');
                const tabs = [
                    { id: 'params', label: 'Trigger Parameters' },
                    { id: 'global-data', label: 'Global Data' },
                    { id: 'settings', label: 'Settings' },
                    { id: 'properties', label: 'Properties' }
                ];

                const triggerParams = tParams || [];
                const explicitParams = computed(() => triggerParams.filter(p => !p.isImplicit));
                const implicitParams = computed(() => triggerParams.filter(p => p.isImplicit));

                const paramValues = reactive({});
                triggerParams.forEach(p => {
                    paramValues[p.name] = p.defaultValue || '';
                });

                const workflow = reactive({
                    name: `{{JSON_NAME}}`,
                    description: `{{JSON_DESCRIPTION}}`,
                    version: `{{JSON_VERSION}}`,
                    extVersion: `{{JSON_EXT_VERSION}}`,
                    icon: `{{JSON_ICON}}` || 'riGlobalLine',
                    globalData: `{{JSON_GLOBAL_DATA}}`,
                    table: `{{JSON_TABLE}}`,
                    settings: `{{JSON_SETTINGS}}`,
                    includedWorkflows: `{{JSON_INCLUDED_WORKFLOWS}}`
                });

                const iconsList = ref([
                    'mdiPackageVariantClosed', 'riGlobalLine', 'riFileTextLine', 'riEqualizerLine', 'riTimerLine', 'riCalendarLine', 'riFlashlightLine', 'riLightbulbFlashLine', 'riDatabase2Line', 'riWindowLine', 'riCursorLine', 'riDownloadLine', 'riCommandLine'
                ]);

                if (workflow.icon && !iconsList.value.includes(workflow.icon)) {
                    iconsList.value.push(workflow.icon);
                }

                const camelToKebab = (str) => {
                    return str.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                };

                const iconClass = computed(() => {
                    const kebab = camelToKebab(workflow.icon);
                    if (workflow.icon.startsWith('mdi')) {
                        return 'mdi ' + kebab;
                    }
                    return kebab;
                });

                const paramsForm = ref(null);

                const saveWorkflow = () => {
                    vscode.postMessage({
                        command: 'saveWorkflow',
                        data: JSON.parse(JSON.stringify(workflow))
                    });
                };

                const openStudio = () => {
                    vscode.postMessage({
                        command: 'openInStudio'
                    });
                };

                const runWorkflow = () => {
                    if (paramsForm.value && !paramsForm.value.checkValidity()) {
                        paramsForm.value.reportValidity();
                        return;
                    }
                    
                    const params = {};
                    for (const key in paramValues) {
                        if (paramValues[key] !== '') {
                            params[key] = paramValues[key];
                        }
                    }
                    
                    vscode.postMessage({
                        command: 'runWorkflow',
                        parameters: params
                    });
                };

                return {
                    currentTab,
                    tabs,
                    triggerParams,
                    paramValues,
                    workflow,
                    iconsList,
                    iconClass,
                    saveWorkflow,
                    openStudio,
                    runWorkflow,
                    explicitParams,
                    implicitParams,
                    paramsForm
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
