<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Quick Edit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Theme configuration to map VS Code colors to Tailwind */
        :root {
            --vsc-bg: var(--vscode-editor-background);
            --vsc-fg: var(--vscode-editor-foreground);
            --vsc-muted: var(--vscode-descriptionForeground);
            --vsc-border: var(--vscode-panel-border);
            --vsc-widget: var(--vscode-editorWidget-background);
            --vsc-button-bg: var(--vscode-button-background);
            --vsc-button-fg: var(--vscode-button-foreground);
            --vsc-button-hover: var(--vscode-button-hoverBackground);
            --vsc-input-bg: var(--vscode-input-background);
            --vsc-input-fg: var(--vscode-input-foreground);
            --vsc-input-border: var(--vscode-input-border);
            --vsc-link: var(--vscode-textLink-foreground);
        }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--vsc-bg);
            color: var(--vsc-fg);
            font-family: var(--vscode-font-family), -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--vscode-scrollbarSlider-background); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--vscode-scrollbarSlider-hoverBackground); }
        ::-webkit-scrollbar-thumb:active { background: var(--vscode-scrollbarSlider-activeBackground); }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vsc: {
                            bg: 'var(--vsc-bg)',
                            fg: 'var(--vsc-fg)',
                            muted: 'var(--vsc-muted)',
                            border: 'var(--vsc-border)',
                            widget: 'var(--vsc-widget)',
                            button: 'var(--vsc-button-bg)',
                            buttonHover: 'var(--vsc-button-hover)',
                            buttonText: 'var(--vsc-button-fg)',
                            input: 'var(--vsc-input-bg)',
                            inputText: 'var(--vsc-input-fg)',
                            inputBorder: 'var(--vsc-input-border)',
                            link: 'var(--vsc-link)',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- Remix Icons and Material Design Icons for Icon Preview -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet" />
    <!-- CodeMirror 5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <style>
        .CodeMirror {
            background-color: var(--vsc-input-bg);
            color: var(--vsc-input-fg);
            font-family: var(--vscode-editor-font-family), 'Consolas', 'Courier New', monospace;
            font-size: 13px;
            height: auto;
            min-height: 120px;
        }
        .CodeMirror-scroll {
            min-height: 120px;
        }
        .CodeMirror-gutters {
            background-color: var(--vsc-bg);
            border-right: 1px solid var(--vsc-border);
        }
        .CodeMirror-linenumber {
            color: var(--vsc-muted);
        }
        .CodeMirror-cursor {
            border-left: 2px solid var(--vsc-input-fg);
        }
        .CodeMirror-selected {
            background: var(--vscode-editor-selectionBackground, #3a3d41);
        }
        .CodeMirror-focused .CodeMirror-selected {
            background: var(--vscode-editor-selectionBackground, #264f78);
        }
        .CodeMirror-line::selection, .CodeMirror-line > span::selection, .CodeMirror-line > span > span::selection {
            background: rgba(255, 255, 255, 0.1);
        }
        /* Basic syntax highlighting colors mimicking VSCode Dark */
        .cm-s-default .cm-string { color: #ce9178; }
        .cm-s-default .cm-property { color: #9cdcfe; }
        .cm-s-default .cm-number { color: #b5cea8; }
        .cm-s-default .cm-keyword { color: #569cd6; }
        .cm-s-default .cm-atom { color: #569cd6; } /* true, false, null */
        .cm-s-default .cm-def { color: #dcdcaa; }
        .cm-s-default .cm-operator { color: #d4d4d4; }
        .cm-s-default .cm-comment { color: #6A9955; }
    </style>
</head>
<body class="flex h-screen flex-col bg-vsc-bg text-vsc-fg font-sans m-0 overflow-hidden">
    <div id="app" class="flex flex-col h-full w-full">
        <!-- Actions Toolbar -->
        <div class="flex flex-wrap items-center justify-between px-4 py-2 gap-2">
            <div class="flex-1 min-w-[200px]">
                {{UPDATED_AT_HTML}}
            </div>
            <div class="flex gap-2 flex-shrink-0 items-center ml-auto">
                <button @click="saveWorkflow" class="px-3 py-1 text-sm bg-vsc-bg hover:bg-vsc-border text-vsc-fg font-medium rounded border border-vsc-border transition-colors flex items-center gap-1.5 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M7 19v-6h10v6h2V7.828L16.172 5H5v14h2zM4 3h13l4 4v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm5 12v4h6v-4H9z"/></svg>
                    Save
                </button>
                <button @click="openStudio" class="px-3 py-1 text-sm bg-vsc-bg hover:bg-vsc-border text-vsc-fg font-medium rounded border border-vsc-border transition-colors flex items-center gap-1.5 shadow-sm" title="Edit in Automa Studio">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M10 21V23H6C4.89543 23 4 22.1046 4 21V3C4 1.89543 4.89543 1 6 1H18C19.1046 1 20 1.89543 20 3V10H18V3H6V21H10ZM15.5355 12.4645C17.4882 10.5118 20.654 10.5118 22.6066 12.4645C24.5592 14.4171 24.5592 17.5829 22.6066 19.5355L21.1924 18.1213C22.3639 16.9497 22.3639 15.0503 21.1924 13.8787C20.0208 12.7071 18.1213 12.7071 16.9497 13.8787L15.5355 12.4645ZM18.4645 21.5355C16.5118 23.4882 13.346 23.4882 11.3934 21.5355C9.44078 19.5829 9.44078 16.4171 11.3934 14.4645L12.8076 15.8787C11.636 17.0503 11.636 18.9497 12.8076 20.1213C13.9792 21.2929 15.8787 21.2929 17.0503 20.1213L18.4645 21.5355ZM14.8284 14.8284L19.0711 19.0711L17.6569 20.4853L13.4142 16.2426L14.8284 14.8284Z"></path></svg>
                    Edit
                </button>
                <button @click="runWorkflow" class="px-3 py-1 text-sm bg-vsc-button hover:bg-vsc-buttonHover text-vsc-buttonText font-medium rounded shadow transition-colors flex items-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M19.376 12.416L8.777 19.482A.5.5 0 0 1 8 19.066V4.934a.5.5 0 0 1 .777-.416l10.599 7.066a.5.5 0 0 1 0 .832z"/></svg>
                    Run
                </button>
            </div>
        </div>

        <!-- Main Tabs Navigation -->
        <div class="flex border-b border-vsc-border px-4 overflow-x-auto whitespace-nowrap scrollbar-hide">
            <button v-for="tab in tabs" :key="tab.id"
                @click="currentTab = tab.id"
                :class="[
                    'px-3 py-1.5 border-b-2 text-sm font-medium transition-colors flex-shrink-0',
                    currentTab === tab.id ? 'border-vsc-link text-vsc-link' : 'border-transparent text-vsc-muted hover:text-vsc-fg'
                ]">
                {{ tab.label }}
            </button>
        </div>

        <!-- Content Area -->
        <div class="flex-1 overflow-y-auto relative p-4">
            <!-- PARAMS TAB -->
            <div v-show="currentTab === 'params'" class="max-w-3xl">
                <form ref="paramsForm" @submit.prevent="runWorkflow" class="flex flex-col gap-4">
                    <div v-if="triggerParams.length === 0" class="flex flex-col items-center justify-center text-vsc-muted mt-20">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><!-- Icon from Lucide by Lucide Contributors - https://github.com/lucide-icons/lucide/blob/main/LICENSE --><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0m16 4v-2.38c0-2.12 1.03-3.12 1-5.62c-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0m-4-3h4M4 13h4"/></svg>
                        <p class="text-lg">No trigger parameters found.</p>
                    </div>

                    <!-- Explicit Parameters -->
                    <div v-if="explicitParams.length > 0">
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="text-xs font-semibold text-vsc-muted uppercase tracking-wider">Workflow Parameters</h3>
                            <span class="text-[10px] text-vsc-muted italic">Values entered here will run the workflow and be saved as defaults when you click Save.</span>
                        </div>
                        <div v-for="param in explicitParams" :key="param.name" class="flex flex-col gap-1 mb-4">
                            <label class="text-sm font-medium text-vsc-fg">
                                {{ param.name }}
                                <span v-if="param.required" class="text-red-500 ml-1">*</span>
                            </label>
                            <input :type="param.type === 'number' ? 'number' : 'text'" :required="param.required" v-model="paramValues[param.name]" placeholder="Enter value..." 
                                class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded focus:outline-none focus:border-vsc-button">
                            <p v-if="param.description" class="text-xs text-vsc-muted">{{ param.description }}</p>
                        </div>
                    </div>

                    <!-- Implicit/Global Variables -->
                    <div v-if="implicitParams.length > 0">
                        <h3 class="text-xs font-semibold text-vsc-muted uppercase tracking-wider mb-3 mt-4 border-t border-vsc-border pt-4">Derived / Global Variables</h3>
                        <div v-for="param in implicitParams" :key="param.name" class="flex flex-col gap-1 mb-4">
                            <label class="text-sm font-medium text-vsc-fg opacity-80">{{ param.name }}</label>
                            <input type="text" v-model="paramValues[param.name]" placeholder="Enter value..." 
                                class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded opacity-80 focus:outline-none focus:border-vsc-button">
                            <p v-if="param.description" class="text-xs text-vsc-muted">{{ param.description }}</p>
                        </div>
                    </div>
                    <button type="submit" class="hidden">Submit</button>
                </form>
            </div>

            <form ref="workflowForm">
                <!-- PROPERTIES TAB -->
                <div v-show="currentTab === 'properties'" class="max-w-3xl">
                    <div class="flex flex-col gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">ID</label>
                            <input type="text" value="{{JSON_ID}}" readonly class="w-full px-3 py-2 bg-vsc-input text-vsc-muted border border-vsc-inputBorder rounded cursor-not-allowed focus:outline-none">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Name</label>
                            <input type="text" name="name" v-model="workflow.name" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded focus:outline-none focus:border-vsc-button">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Description</label>
                            <textarea name="description" v-model="workflow.description" rows="3" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded text-sm focus:outline-none focus:border-vsc-button"></textarea>
                        </div>
                        <div class="flex gap-4">
                            <div class="flex flex-col gap-1 flex-1">
                                <label class="text-xs text-vsc-fg">Version</label>
                                <input type="text" name="version" v-model="workflow.version" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded focus:outline-none focus:border-vsc-button">
                            </div>
                            <div class="flex flex-col gap-1 flex-1">
                                <label class="text-xs text-vsc-fg">ExtVersion</label>
                                <input type="text" name="extVersion" v-model="workflow.extVersion" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded focus:outline-none focus:border-vsc-button">
                            </div>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Icon</label>
                            <div class="flex items-center gap-2">
                                <div class="flex-shrink-0 w-9 h-9 rounded bg-vsc-input border border-vsc-inputBorder flex items-center justify-center text-vsc-fg text-xl shadow-sm">
                                    <i :class="iconClass"></i>
                                </div>
                                <select name="icon" v-model="workflow.icon" class="w-full px-3 py-2 bg-vsc-input text-vsc-inputText border border-vsc-inputBorder rounded focus:outline-none focus:border-vsc-button appearance-none cursor-pointer">
                                    <option v-for="icon in iconsList" :key="icon" :value="icon">{{ icon }}</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- GLOBAL DATA TAB -->
                <div v-show="currentTab === 'global-data'" class="max-w-3xl">
                    <div class="flex flex-col gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Global Data (String/JSON)</label>
                            <json-editor v-model="workflow.globalData"></json-editor>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Table (JSON Array)</label>
                            <json-editor v-model="workflow.table" min-height="160px"></json-editor>
                        </div>
                    </div>
                </div>

                <!-- SETTINGS TAB -->
                <div v-show="currentTab === 'settings'" class="max-w-3xl">
                    <div class="flex flex-col gap-4">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Settings (JSON)</label>
                            <json-editor v-model="workflow.settings" min-height="200px"></json-editor>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-vsc-fg">Included Workflows (JSON)</label>
                            <json-editor v-model="workflow.includedWorkflows"></json-editor>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        {{INJECT_PARAMS_DATA}}
        const vscode = acquireVsCodeApi();

        const { createApp, ref, reactive, computed, onMounted, watch } = Vue;

        const JsonEditor = {
            props: {
                modelValue: String,
                minHeight: { type: String, default: '120px' }
            },
            emits: ['update:modelValue'],
            template: `<div ref="editorContainer" class="w-full border border-vsc-inputBorder rounded overflow-hidden focus-within:border-vsc-button transition-colors"></div>`,
            setup(props, { emit }) {
                const editorContainer = ref(null);
                let editor = null;
                let isInternalChange = false;

                onMounted(() => {
                    editor = CodeMirror(editorContainer.value, {
                        value: props.modelValue || '',
                        mode: { name: "javascript", json: true },
                        lineNumbers: true,
                        tabSize: 2,
                        lineWrapping: true,
                        viewportMargin: Infinity
                    });

                    // Set height based on prop
                    if (editorContainer.value) {
                        const cmEl = editorContainer.value.querySelector('.CodeMirror');
                        if (cmEl) {
                            cmEl.style.minHeight = props.minHeight;
                        }
                    }

                    editor.on('change', () => {
                        isInternalChange = true;
                        emit('update:modelValue', editor.getValue());
                        // Refresh internal flag after next tick to allow watch to ignore it
                        setTimeout(() => { isInternalChange = false; }, 0);
                    });
                    
                    // Refresh layout if tab changes make it visible
                    const observer = new IntersectionObserver((entries) => {
                        if (entries[0].isIntersecting && editor) {
                            setTimeout(() => editor.refresh(), 10);
                        }
                    });
                    observer.observe(editorContainer.value);
                });

                watch(() => props.modelValue, (newVal) => {
                    if (editor && !isInternalChange && editor.getValue() !== newVal) {
                        editor.setValue(newVal || '');
                    }
                });

                return { editorContainer };
            }
        };

        const app = createApp({
            setup() {
                const currentTab = ref('params');
                const tabs = [
                    { id: 'params', label: 'Trigger Parameters' },
                    { id: 'global-data', label: 'Global Data' },
                    { id: 'settings', label: 'Settings' },
                    { id: 'properties', label: 'Properties' }
                ];

                const triggerParams = tParams || [];
                const explicitParams = computed(() => triggerParams.filter(p => !p.isImplicit));
                const implicitParams = computed(() => triggerParams.filter(p => p.isImplicit));

                const paramValues = reactive({});
                triggerParams.forEach(p => {
                    paramValues[p.name] = p.defaultValue || '';
                });

                const keepBrowserOpen = ref(typeof defaultKeepBrowserOpen !== 'undefined' ? defaultKeepBrowserOpen : false);

                const workflow = reactive({
                    name: `{{JSON_NAME}}`,
                    description: `{{JSON_DESCRIPTION}}`,
                    version: `{{JSON_VERSION}}`,
                    extVersion: `{{JSON_EXT_VERSION}}`,
                    icon: `{{JSON_ICON}}` || 'riGlobalLine',
                    globalData: `{{JSON_GLOBAL_DATA}}`,
                    table: `{{JSON_TABLE}}`,
                    settings: `{{JSON_SETTINGS}}`,
                    includedWorkflows: `{{JSON_INCLUDED_WORKFLOWS}}`
                });

                const iconsList = ref([
                    'mdiPackageVariantClosed', 'riGlobalLine', 'riFileTextLine', 'riEqualizerLine', 'riTimerLine', 'riCalendarLine', 'riFlashlightLine', 'riLightbulbFlashLine', 'riDatabase2Line', 'riWindowLine', 'riCursorLine', 'riDownloadLine', 'riCommandLine'
                ]);

                if (workflow.icon && !iconsList.value.includes(workflow.icon)) {
                    iconsList.value.push(workflow.icon);
                }

                const camelToKebab = (str) => {
                    return str.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                };

                const iconClass = computed(() => {
                    const kebab = camelToKebab(workflow.icon);
                    if (workflow.icon.startsWith('mdi')) {
                        return `mdi ${kebab}`;
                    }
                    return kebab;
                });

                const paramsForm = ref(null);

                const saveWorkflow = () => {
                    const dataToSave = JSON.parse(JSON.stringify(workflow));
                    
                    // Allow saving current explicit parameter values as defaultValue in workflow
                    const explicitParamsData = {};
                    triggerParams.forEach(p => {
                        if (!p.isImplicit) {
                            explicitParamsData[p.name] = paramValues[p.name];
                        }
                    });
                    dataToSave.triggerParams = explicitParamsData;

                    vscode.postMessage({
                        command: 'saveWorkflow',
                        data: dataToSave
                    });
                };

                const openStudio = () => {
                    vscode.postMessage({
                        command: 'openInStudio'
                    });
                };

                const runWorkflow = () => {
                    if (paramsForm.value && !paramsForm.value.checkValidity()) {
                        paramsForm.value.reportValidity();
                        return;
                    }
                    
                    const params = {};
                    const triggerParamsData = {};
                    
                    triggerParams.forEach(p => {
                        if (p.isImplicit) {
                            params[p.name] = paramValues[p.name];
                        } else {
                            triggerParamsData[p.name] = paramValues[p.name];
                        }
                    });

                    // Append trigger data so the CLI can pick it up
                    if (Object.keys(triggerParamsData).length > 0) {
                        params.__triggerParams = triggerParamsData;
                    }

                    vscode.postMessage({
                        command: 'runWorkflow',
                        parameters: params
                    });
                };

                return {
                    currentTab,
                    tabs,
                    triggerParams,
                    paramValues,
                    keepBrowserOpen,
                    workflow,
                    iconsList,
                    iconClass,
                    saveWorkflow,
                    openStudio,
                    runWorkflow,
                    explicitParams,
                    implicitParams,
                    paramsForm
                };
            }
        });
        
        app.component('json-editor', JsonEditor);
        app.mount('#app');
    </script>
</body>
</html>
