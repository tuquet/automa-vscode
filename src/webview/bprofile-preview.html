<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Profile Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --vsc-bg: var(--vscode-editor-background);
            --vsc-fg: var(--vscode-editor-foreground);
            --vsc-muted: var(--vscode-descriptionForeground);
            --vsc-border: var(--vscode-panel-border);
            --vsc-widget: var(--vscode-editorWidget-background);
            --vsc-button-bg: var(--vscode-button-background);
            --vsc-button-fg: var(--vscode-button-foreground);
            --vsc-button-hover: var(--vscode-button-hoverBackground);
            --vsc-input-bg: var(--vscode-input-background);
            --vsc-input-fg: var(--vscode-input-foreground);
            --vsc-input-border: var(--vscode-input-border);
            --vsc-link: var(--vscode-textLink-foreground);
        }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--vsc-bg);
            color: var(--vsc-fg);
            font-family: var(--vscode-font-family), -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--vscode-scrollbarSlider-background); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--vscode-scrollbarSlider-hoverBackground); }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vsc: {
                            bg: 'var(--vsc-bg)',
                            fg: 'var(--vsc-fg)',
                            muted: 'var(--vsc-muted)',
                            border: 'var(--vsc-border)',
                            widget: 'var(--vsc-widget)',
                            button: 'var(--vsc-button-bg)',
                            buttonHover: 'var(--vsc-button-hover)',
                            buttonText: 'var(--vsc-button-fg)',
                            input: 'var(--vsc-input-bg)',
                            inputText: 'var(--vsc-input-fg)',
                            inputBorder: 'var(--vsc-input-border)',
                            link: 'var(--vsc-link)',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <style>
        .CodeMirror {
            height: auto;
            min-height: 200px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 13px;
            background-color: var(--vsc-input-bg);
            color: var(--vsc-input-fg);
        }
        .CodeMirror-scroll { min-height: 200px; }
        .CodeMirror-gutters {
            background-color: var(--vsc-widget);
            border-right: 1px solid var(--vsc-border);
        }
        .CodeMirror-linenumber { color: var(--vsc-muted); }
        .CodeMirror-cursor { border-left-color: var(--vsc-fg); }
        .CodeMirror-selected { background: var(--vscode-editor-selectionBackground, #264f78); }
        .cm-s-default .cm-property { color: #9CDCFE; }
        .cm-s-default .cm-string { color: #CE9178; }
        .cm-s-default .cm-number { color: #B5CEA8; }
        .cm-s-default .cm-keyword { color: #569CD6; }
        .cm-s-default .cm-atom { color: #569CD6; }
    </style>
</head>
<body class="flex flex-col bg-vsc-bg text-vsc-fg font-sans m-0 h-screen overflow-hidden">
    <div id="app" class="flex flex-col h-full w-full">
        <!-- Actions Toolbar -->
        <div class="flex flex-wrap items-center justify-between px-4 py-2 gap-2 border-b border-vsc-border bg-vsc-widget">
            <div class="flex-1 min-w-[200px] flex items-center gap-2 text-sm text-vsc-muted">
                <span class="text-[10px] px-1.5 py-0.5 bg-vsc-button text-vsc-buttonText rounded-sm shadow-sm font-medium leading-none uppercase tracking-wide">{{LABEL}}</span>
                <span class="text-vsc-fg font-medium flex items-center gap-1"><i class="{{ICON}}"></i> {{ profileName }}</span>
            </div>
            
            <div class="flex border border-vsc-border rounded overflow-hidden shadow-sm">
                <button v-if="!isTable" @click="switchToForm" :class="['px-3 py-1 text-xs font-medium transition-colors flex items-center gap-1', viewMode === 'form' ? 'bg-vsc-button text-vsc-buttonText' : 'bg-vsc-bg text-vsc-fg hover:bg-vsc-widget', jsonError ? 'opacity-50 cursor-not-allowed' : '']" :title="jsonError ? 'Fix JSON errors before using Form mode' : ''">
                    <i class="ri-layout-masonry-line"></i> Form
                </button>
                <button @click="viewMode = 'json'" :class="['px-3 py-1 text-xs font-medium transition-colors flex items-center gap-1', (!isTable) ? 'border-l border-vsc-border' : '', viewMode === 'json' ? 'bg-vsc-button text-vsc-buttonText' : 'bg-vsc-bg text-vsc-fg hover:bg-vsc-widget']">
                    <i class="ri-code-s-slash-line"></i> JSON
                </button>
            </div>

            <div class="flex gap-2 flex-shrink-0 items-center ml-auto">
                <button v-if="viewMode === 'json'" @click="formatJson" class="px-3 py-1 text-sm bg-vsc-bg hover:bg-vsc-border text-vsc-fg font-medium rounded border border-vsc-border transition-colors flex items-center gap-1.5 shadow-sm">
                    <i class="ri-code-s-slash-line text-sm"></i> Format
                </button>
                <button v-if="isModified" @click="saveChanges" class="px-3 py-1 text-sm bg-amber-600 hover:bg-amber-700 text-white font-medium rounded shadow transition-colors flex items-center gap-1.5 mr-1">
                    <i class="ri-save-line text-sm"></i> Save
                </button>
                <button v-else @click="saveChanges" class="px-3 py-1 text-sm bg-vsc-bg hover:bg-vsc-border text-vsc-fg font-medium rounded border border-vsc-border transition-colors flex items-center gap-1.5 shadow-sm">
                    <i class="ri-save-line text-sm"></i> Save
                </button>
            </div>
        </div>

        <!-- Content -->
        <div class="flex-1 relative flex flex-col">
            <!-- JSON View -->
            <div v-show="viewMode === 'json'" class="w-full h-full absolute inset-0">
                <json-editor v-model="profileDataStr" min-height="100%"></json-editor>
            </div>

            <!-- Form View -->
            <div v-if="viewMode === 'form' && formData" class="w-full h-full absolute inset-0 overflow-y-auto p-6 flex flex-col gap-6">
                <div class="max-w-4xl mx-auto w-full">
                    
                    <!-- Profile Form -->
                    <div v-if="!Array.isArray(formData)" class="flex flex-col gap-5">
                        <div class="grid grid-cols-2 gap-5">
                            <div class="flex flex-col gap-1.5">
                                <label class="text-xs font-semibold text-vsc-muted uppercase tracking-wider">ID</label>
                                <input v-model="formData.id" @input="syncToJson" placeholder="e.g. default-profile" class="px-3 py-2 bg-vsc-input border border-vsc-inputBorder rounded text-sm focus:outline-none focus:border-vsc-button transition-colors">
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label class="text-xs font-semibold text-vsc-muted uppercase tracking-wider">Name</label>
                                <input v-model="formData.name" @input="syncToJson" placeholder="e.g. My Profile" class="px-3 py-2 bg-vsc-input border border-vsc-inputBorder rounded text-sm focus:outline-none focus:border-vsc-button transition-colors">
                            </div>
                        </div>
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-semibold text-vsc-muted uppercase tracking-wider">User Agent</label>
                            <textarea v-model="formData.userAgent" @input="syncToJson" rows="2" placeholder="Mozilla/5.0..." class="px-3 py-2 bg-vsc-input border border-vsc-inputBorder rounded text-sm focus:outline-none focus:border-vsc-button transition-colors resize-y"></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-5">
                            <div class="flex flex-col gap-1.5">
                                <label class="text-xs font-semibold text-vsc-muted uppercase tracking-wider">Timezone</label>
                                <input v-model="formData.timezone" @input="syncToJson" placeholder="e.g. Asia/Ho_Chi_Minh" class="px-3 py-2 bg-vsc-input border border-vsc-inputBorder rounded text-sm focus:outline-none focus:border-vsc-button transition-colors">
                            </div>
                            <div class="flex flex-col gap-1.5">
                                <label class="text-xs font-semibold text-vsc-muted uppercase tracking-wider">Proxy</label>
                                <input v-model="formData.proxy" @input="syncToJson" placeholder="http://user:pass@ip:port" class="px-3 py-2 bg-vsc-input border border-vsc-inputBorder rounded text-sm focus:outline-none focus:border-vsc-button transition-colors">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Variables/Credentials List Form (Array) -->
                    <div v-else-if="Array.isArray(formData)" class="flex flex-col gap-3">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-sm font-semibold text-vsc-muted uppercase tracking-wider">Data Entries ({{formData.length}})</h3>
                            <button @click="addArrayItem" class="px-3 py-1 text-xs bg-vsc-button hover:bg-vsc-buttonHover text-vsc-buttonText rounded transition-colors shadow-sm flex items-center gap-1">
                                <i class="ri-add-line"></i> Add Entry
                            </button>
                        </div>
                        
                        <div v-if="formData.length === 0" class="py-12 border-2 border-dashed border-vsc-border rounded-lg flex flex-col items-center justify-center text-vsc-muted">
                            <i class="ri-inbox-archive-line text-3xl mb-2 opacity-50"></i>
                            <p class="text-sm">No entries found.</p>
                        </div>

                        <div v-for="(item, idx) in formData" :key="idx" class="flex items-start gap-3 p-3 bg-vsc-widget border border-vsc-border rounded-lg shadow-sm relative group">
                            <div class="flex-1 grid grid-cols-12 gap-3">
                                <div class="col-span-3 flex flex-col gap-1">
                                    <label class="text-[10px] text-vsc-muted uppercase">ID</label>
                                    <input v-model="item.id" @input="syncToJson" placeholder="ID" class="w-full px-2 py-1.5 bg-vsc-input border border-vsc-inputBorder rounded text-xs focus:outline-none focus:border-vsc-button">
                                </div>
                                <div class="col-span-3 flex flex-col gap-1">
                                    <label class="text-[10px] text-vsc-muted uppercase">Name</label>
                                    <input v-model="item.name" @input="syncToJson" placeholder="Name" class="w-full px-2 py-1.5 bg-vsc-input border border-vsc-inputBorder rounded text-xs focus:outline-none focus:border-vsc-button">
                                </div>
                                <div class="col-span-6 flex flex-col gap-1">
                                    <label class="text-[10px] text-vsc-muted uppercase">Value</label>
                                    <input v-model="item.value" @input="syncToJson" placeholder="Value..." class="w-full px-2 py-1.5 bg-vsc-input border border-vsc-inputBorder rounded text-xs focus:outline-none focus:border-vsc-button font-mono">
                                </div>
                            </div>
                            <button @click="removeArrayItem(idx)" class="mt-5 w-8 h-8 flex items-center justify-center text-vsc-muted hover:text-red-400 hover:bg-red-500/10 rounded transition-colors" title="Delete">
                                <i class="ri-delete-bin-line"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Error Banner overlay -->
            <div v-if="jsonError" class="absolute bottom-4 left-4 right-4 p-3 border border-red-900 bg-red-900/90 text-red-200 rounded text-sm font-mono flex items-start gap-2 shadow-lg z-10 backdrop-blur-sm">
                <i class="ri-error-warning-line mt-0.5"></i>
                <div>{{ jsonError }}</div>
            </div>
        </div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        const initialData = `{{PROFILE_DATA}}`;
        const initialName = `{{PROFILE_NAME}}`;
        const isTable = {{IS_TABLE}};

        const { createApp, ref, onMounted, watch } = Vue;

        const JsonEditor = {
            props: {
                modelValue: String,
                minHeight: { type: String, default: '200px' }
            },
            emits: ['update:modelValue'],
            template: `<div ref="editorContainer" class="w-full h-full absolute inset-0"></div>`,
            setup(props, { emit }) {
                const editorContainer = ref(null);
                let editor = null;
                let isInternalChange = false;

                onMounted(() => {
                    editor = CodeMirror(editorContainer.value, {
                        value: props.modelValue || '',
                        mode: { name: "javascript", json: true },
                        lineNumbers: true,
                        tabSize: 2,
                        lineWrapping: true,
                        viewportMargin: Infinity
                    });

                    editor.on('change', () => {
                        isInternalChange = true;
                        emit('update:modelValue', editor.getValue());
                        setTimeout(() => { isInternalChange = false; }, 0);
                    });
                    
                    const observer = new IntersectionObserver((entries) => {
                        if (entries[0].isIntersecting && editor) {
                            setTimeout(() => editor.refresh(), 10);
                        }
                    });
                    observer.observe(editorContainer.value);
                });

                watch(() => props.modelValue, (newVal) => {
                    if (editor && !isInternalChange && editor.getValue() !== newVal) {
                        editor.setValue(newVal || '');
                    }
                });

                return { editorContainer };
            }
        };

        const app = createApp({
            data() {
                const state = vscode.getState() || {};
                
                let loadedDataStr = initialData;
                let loadedJsonError = null;
                if (state.lastDocumentData === initialData) {
                    if (state.profileDataStr !== undefined) loadedDataStr = state.profileDataStr;
                    if (state.jsonError !== undefined) loadedJsonError = state.jsonError;
                }
                
                return {
                    viewMode: state.viewMode || (isTable ? 'json' : 'form'),
                    isTable,
                    profileName: initialName,
                    profileDataStr: loadedDataStr,
                    initialDataStr: initialData,
                    jsonError: loadedJsonError,
                    formData: null,
                    isInternalSync: false
                }
            },
            created() {
                this.syncToForm();
            },
            mounted() {
                window.addEventListener('message', event => {
                    const message = event.data;
                    if (message.type === 'update') {
                        const state = vscode.getState() || {};
                        if (state.lastDocumentData === message.text) {
                            return; // unchanged
                        }
                        this.profileDataStr = message.text;
                        this.initialDataStr = message.text;
                    }
                });
            },
            computed: {
                isModified() {
                    return this.profileDataStr !== this.initialDataStr;
                }
            },
            watch: {
                viewMode(newMode) {
                    const state = vscode.getState() || {};
                    vscode.setState({ ...state, viewMode: newMode });
                },
                profileDataStr(newVal) {
                    const state = vscode.getState() || {};
                    
                    if (this.isInternalSync) {
                        vscode.setState({ ...state, profileDataStr: newVal, lastDocumentData: initialData, jsonError: null });
                        return;
                    }
                    try {
                        JSON.parse(newVal);
                        this.jsonError = null;
                        vscode.setState({ ...state, profileDataStr: newVal, jsonError: null, lastDocumentData: initialData });
                        this.syncToForm();
                    } catch (e) {
                        this.jsonError = e.message;
                        vscode.setState({ ...state, profileDataStr: newVal, jsonError: e.message, lastDocumentData: initialData });
                    }
                }
            },
            methods: {
                syncToForm() {
                    try {
                        this.formData = JSON.parse(this.profileDataStr);
                        if (!this.formData) this.formData = {};
                    } catch(e) {
                        if (!this.formData) this.formData = {};
                    }
                },
                switchToForm() {
                    if (this.jsonError) {
                        vscode.postMessage({ command: 'error', text: 'Cannot switch to Form mode with invalid JSON.' });
                        return;
                    }
                    this.viewMode = 'form';
                },
                async syncToJson() {
                    this.isInternalSync = true;
                    this.profileDataStr = JSON.stringify(this.formData, null, 2);
                    this.jsonError = null;
                    await Vue.nextTick();
                    this.isInternalSync = false;
                },
                addArrayItem() {
                    if (!Array.isArray(this.formData)) {
                        this.formData = [];
                    }
                    this.formData.push({ id: '', name: '', value: '' });
                    this.syncToJson();
                },
                removeArrayItem(idx) {
                    if (Array.isArray(this.formData)) {
                        this.formData.splice(idx, 1);
                        this.syncToJson();
                    }
                },
                formatJson() {
                    try {
                        const parsed = JSON.parse(this.profileDataStr);
                        this.profileDataStr = JSON.stringify(parsed, null, 2);
                        this.jsonError = null;
                    } catch (e) {
                        this.jsonError = e.message;
                    }
                },
                saveChanges() {
                    if (this.jsonError) {
                        vscode.postMessage({ command: 'error', text: 'Cannot save: JSON is invalid.' });
                        return;
                    }

                    try {
                        const parsed = JSON.parse(this.profileDataStr);
                        this.profileDataStr = JSON.stringify(parsed, null, 2);
                        if (this.viewMode === 'form') {
                            this.syncToForm();
                        }
                    } catch(e) {
                        vscode.postMessage({ command: 'error', text: 'Cannot save: JSON is invalid.' });
                        return;
                    }

                    this.initialDataStr = this.profileDataStr;
                    
                    const state = vscode.getState() || {};
                    vscode.setState({ ...state, lastDocumentData: this.profileDataStr });

                    vscode.postMessage({ 
                        type: 'save-profile', 
                        data: this.profileDataStr 
                    });
                }
            }
        });
        
        app.component('json-editor', JsonEditor);
        app.mount('#app');
    </script>
</body>
</html>
